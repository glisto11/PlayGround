<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <title>DUEL 24 ZONES — ONLINE ROOM LIST CARD DUEL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow a"></div>
    <div class="bg-glow b"></div>
    <div class="bg-grid"></div>
    <div class="scanlines"></div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span>24</span></div>
        <div class="brand-text">
          <h1>DUEL <em>24</em> <span>ZONES</span></h1>
          <p>ONLINE ROOM LIST / CARD DUEL</p>
        </div>
      </div>
      <div id="hud" class="hud"></div>
      <div class="top-tools">
        <button class="icon-btn" data-act="toggle-rooms" title="ルーム一覧">☰<span>ROOMS</span></button>
        <button class="icon-btn" data-act="sound" id="soundBtn" title="サウンド">◈<span>SOUND</span></button>
        <button class="icon-btn" data-act="rules" title="遊び方">?<span>RULES</span></button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel rooms-panel" id="roomsPanel"></aside>

      <section class="arena">
        <div class="opp-strip">
          <span class="strip-label">OPPONENT HAND</span>
          <div id="oppHand" class="opp-hand"></div>
          <span class="strip-status"><i></i> LIVE DUEL</span>
        </div>
        <div id="board" class="board"></div>
        <div id="handArea" class="hand-area"></div>
      </section>

      <aside class="panel info-panel">
        <div id="detail" class="detail"></div>
        <div id="actions" class="actions"></div>
        <div class="log-panel">
          <div class="log-head"><span>DUEL LOG</span><em>● LIVE</em></div>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
